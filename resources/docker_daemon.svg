<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Docker Daemon Architecture</text>

  <!-- Client -->
  <rect x="30" y="130" width="210" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Docker Client</text>
  <text x="135" y="203" text-anchor="middle" font-size="15" fill="#1e3a8a">(docker CLI)</text>
  <text x="135" y="228" text-anchor="middle" font-size="13" fill="#1e3a8a">the "waiter"</text>
  <rect x="30" y="290" width="210" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="135" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Commands</text>
  <text x="135" y="344" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#334155">docker build</text>
  <text x="135" y="364" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#334155">docker pull / push</text>
  <text x="135" y="384" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#334155">docker run</text>

  <!-- API arrow -->
  <line x1="240" y1="190" x2="358" y2="190" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="299" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">REST API</text>
  <text x="299" y="212" text-anchor="middle" font-size="11" fill="#475569">unix socket /</text>
  <text x="299" y="226" text-anchor="middle" font-size="11" fill="#475569">named pipe</text>

  <!-- Docker Host -->
  <rect x="340" y="65" width="560" height="605" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="360" y="90" font-size="15" font-weight="700" fill="#475569">DOCKER HOST</text>

  <!-- Daemon -->
  <rect x="360" y="105" width="520" height="190" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="620" y="137" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">Docker Daemon (dockerd)</text>
  <text x="620" y="158" text-anchor="middle" font-size="13" fill="#075985">the "kitchen": listens to API, does the real work</text>

  <rect x="378" y="180" width="110" height="90" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="433" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Images</text>
  <text x="433" y="236" text-anchor="middle" font-size="11" fill="#475569">build, pull,</text>
  <text x="433" y="251" text-anchor="middle" font-size="11" fill="#475569">store layers</text>

  <rect x="498" y="180" width="110" height="90" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="553" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Containers</text>
  <text x="553" y="236" text-anchor="middle" font-size="11" fill="#475569">create, start,</text>
  <text x="553" y="251" text-anchor="middle" font-size="11" fill="#475569">stop, delete</text>

  <rect x="618" y="180" width="110" height="90" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="673" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Networks</text>
  <text x="673" y="236" text-anchor="middle" font-size="11" fill="#475569">bridge, host,</text>
  <text x="673" y="251" text-anchor="middle" font-size="11" fill="#475569">overlay</text>

  <rect x="738" y="180" width="124" height="90" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="800" y="215" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Volumes</text>
  <text x="800" y="236" text-anchor="middle" font-size="11" fill="#475569">persistent</text>
  <text x="800" y="251" text-anchor="middle" font-size="11" fill="#475569">data storage</text>

  <!-- containerd -->
  <line x1="620" y1="295" x2="620" y2="378" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="470" y="380" width="300" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="408" text-anchor="middle" font-size="17" font-weight="700" fill="#78350f">containerd</text>
  <text x="620" y="431" text-anchor="middle" font-size="12" fill="#78350f">container runtime manager (images, lifecycle)</text>

  <!-- runc -->
  <line x1="620" y1="450" x2="620" y2="488" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="470" y="490" width="300" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="620" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#831843">runc</text>
  <text x="620" y="541" text-anchor="middle" font-size="12" fill="#831843">low-level runtime: creates the container process</text>

  <!-- running containers -->
  <line x1="620" y1="560" x2="620" y2="588" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="400" y="590" width="440" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="617" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Running Containers</text>
  <text x="620" y="638" text-anchor="middle" font-size="12" fill="#14532d">isolated using Linux namespaces + cgroups</text>

  <!-- Registry -->
  <line x1="880" y1="190" x2="978" y2="190" stroke="#334155" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="929" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">pull / push</text>
  <rect x="980" y="130" width="190" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1075" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Registry</text>
  <text x="1075" y="204" text-anchor="middle" font-size="14" fill="#4c1d95">Docker Hub / ECR /</text>
  <text x="1075" y="223" text-anchor="middle" font-size="14" fill="#4c1d95">private registry</text>
</svg>
